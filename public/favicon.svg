<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Note Taking App</title>
  <!-- app tile -->
  <rect width="64" height="64" rx="14" fill="#3b5bdb"/>
  <!-- note page with a folded corner -->
  <path d="M15 11h24l10 10v30a3 3 0 0 1-3 3H15a3 3 0 0 1-3-3V14a3 3 0 0 1 3-3z" fill="#fff"/>
  <path d="M39 11v7a3 3 0 0 0 3 3h7z" fill="#dbe4ff"/>
  <!-- written lines -->
  <g stroke="#a5b4fc" stroke-width="3" stroke-linecap="round">
    <path d="M19 26h18M19 33h22M19 40h12"/>
  </g>
  <!-- pen, writing diagonally across the page -->
  <g transform="rotate(45 44 40)">
    <rect x="40" y="18" width="8" height="26" rx="2" fill="#fab005"/>
    <rect x="40" y="18" width="8" height="5" rx="2" fill="#f08c00"/>
    <rect x="40" y="40" width="8" height="3" fill="#495057"/>
    <path d="M40 43h8l-4 8z" fill="#ffe8cc"/>
    <path d="M42.6 48.2 44 51l1.4-2.8z" fill="#212529"/>
  </g>
</svg>
